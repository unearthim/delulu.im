  <script>
    const affirmations = [
      "My delusions are my reality. 💖",
      "Everything is conspiring in my favor. 💫",
      "I am a magnet for miracles. ✨",
      "Of course it's working out for me. 😉",
      "I am living proof that 'delulu' is the 'solulu'. 💅",
      "My wildest dreams are just my to-do list. 📝",
      "I attract my desires with ease. 🧘‍♀️",
      "That 'rejection' was just redirection. ↪️",
      "I already have everything I want. 👑",
      "The universe is obsessed with my success. 🌌",
      "I get paid to simply exist. 💸",
      "My aura is 'effortlessly iconic'. ✨",
      "Obstacles? Never heard of them. 🤷‍♀️",
      "The world literally bends to my will. 🌎",
      "I'm the main character, obviously. 🎬",
      "People are competing to give me what I want. 🎁",
      "My bank account refills itself. 🏧",
      "I'm so lucky, it's almost unfair. 🍀",
      "If I want it, it's already mine. 🛍️",
      "My intuition is my superpower. 🔮",
      "Failure is just a rumor I don't believe in. 🤫",
      "I am the universe's favorite. 🌟",
      "I am the standard. The standard is me. 💎",
      "My presence is a present. 🎁",
      "I romanticize my life and it romanticizes me back. 🌹",
      "Things just *happen* to work out for me. 🪄",
      "I'm allergic to 'no'. 🤧",
      "My assumptions create my reality. 🧠",
      "The universe is my personal assistant. 📲",
      "I said 'it is what it is,' and it became what I wanted. 😎",
      "Worrying? That's not in my vocabulary. 📚",
      "I am the 'how'. It gets done because I said so. 🗣️",
      "My energy is a currency, and I'm rich. 💰",
      "I'm living in the reality where I have it all. 🏠💖"
    ];

    let usedAffirmations = [];

    const monument = document.getElementById('monument');
    const addButton = document.getElementById('addStoneButton');

    addButton.addEventListener('click', addStone);

    function addStone() {
      // Reset if all affirmations are used
      if (usedAffirmations.length === affirmations.length) {
        usedAffirmations = [];
      }

      // Find an affirmation not yet used
      let randomAffirmation;
      do {
        randomAffirmation = affirmations[Math.floor(Math.random() * affirmations.length)];
      } while (usedAffirmations.includes(randomAffirmation));

      usedAffirmations.push(randomAffirmation);

      // Create the new "stone" element
      const stone = document.createElement('div');
      stone.className = 'stone';
      stone.textContent = randomAffirmation;

      // Add the stone to the top of the monument
      monument.prepend(stone);
    }

    // Commentary Toggle
    /* --- FIX: Commented out JS for commented-out HTML ---
    const toggleButton = document.getElementById('commentaryToggle');
    const commentaryBox = document.getElementById('commentaryBox');

    toggleButton.addEventListener('click', () => {

            commentaryBox.style.display = 'none';
        } else {
            commentaryBox.style.display = 'block';
        }
    });
    */

    // Add the first stone on load as a foundation
    addStone();

  </script>
